name = "mylaps-proxy"
main = "src/index.js"
compatibility_date = "2025-09-01"

# The address becomes https://mylaps-proxy.<your-account-name>.workers.dev
workers_dev = true

[vars]
# Websites that may call this proxy from a browser (comma separated). "null" = pages opened from a local file.
ALLOWED_ORIGINS = "https://alexanderevers.github.io,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,null"
