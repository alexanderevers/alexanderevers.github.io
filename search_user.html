<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#12121a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ececef" media="(prefers-color-scheme: light)">
    <meta name="description" content="Icesights: get insights in your ice-skating activities.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>Search riders · Icesights</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
    <script src="pwa.js"></script>
</head>
<body>
    <div class="container">
        <h1>User Search</h1>
        <div class="input-group">
            <input type="text" id="searchInput" placeholder="Enter a name to search">
            <button id="searchButton">Search</button>
        </div>
        <div id="resultsContainer"></div>
        <div id="paginationControls" class="pagination-controls">
            <button id="prevButton" disabled>Previous</button>
            <span id="pageInfo">Page 1</span>
            <button id="nextButton" disabled>Next</button>
        </div>
    </div>

    <footer class="theme-switch">
        <span>Light</span>
        <label class="switch">
            <input type="checkbox" id="themeToggle" aria-label="Dark mode">
            <span class="switch-track"></span>
        </label>
        <span>Dark</span>
    </footer>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="search_user.js"></script>
</body>
</html>
