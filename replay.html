<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Replay</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>
<body>
    <div class="container wide">
        <a id="backLink" href="index.html" class="back-link">&larr; Back to activity viewer</a>
        <h1>Race Replay</h1>
        <p id="replaySubtitle" class="muted-note subtitle"></p>

        <p id="replayLoading" class="muted-note hidden"></p>
        <p id="replayError" class="error-message hidden"></p>

        <div id="replayEmpty" class="hidden">
            <p>No replay data found. Open a replay from the main page: fetch an activity, choose
                <strong>Find Overlapping Sessions</strong>, tick the riders you want and press <strong>Open replay</strong>.</p>
        </div>

        <div id="replayApp" class="hidden">
            <button id="shareBtn" class="share-btn" type="button" title="Copy the link to this replay" aria-label="Copy the link to this replay">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
                    <line x1="15.4" y1="6.5" x2="8.6" y2="10.5"></line>
                </svg>
                <span id="shareNote" class="share-note" role="status"></span>
            </button>
            <div id="replayStatus" class="muted-note"></div>
            <div class="track-wrap" id="trackWrap">
                <canvas id="trackCanvas" aria-label="Oblong ice track with the selected riders"></canvas>
                <div id="trackTooltip" class="track-tooltip hidden"></div>
            </div>

            <div class="replay-controls">
                <button id="playBtn" disabled>Play</button>
                <label class="speed-label">Speed
                    <select id="speedSelect">
                        <option value="1">1×</option>
                        <option value="2">2×</option>
                        <option value="5" selected>5×</option>
                        <option value="10">10×</option>
                        <option value="30">30×</option>
                        <option value="60">60×</option>
                    </select>
                </label>
                <span id="clockLabel" class="clock-label">--:--:--</span>
            </div>

            <div class="lap-chart-head">
                <h2>Lap times</h2>
                <label class="speed-label">Rider
                    <select id="followSelect" aria-label="Rider to follow in the lap time graph"></select>
                </label>
                <span id="lapReadout" class="lap-readout"></span>
                <span id="compareReadout" class="compare-readout"></span>
            </div>
            <div class="lap-max-controls">
                <label for="lapMaxSlider">Max lap time</label>
                <input type="range" id="lapMaxSlider" min="10" max="180" step="0.1" value="60">
                <input type="text" id="lapMaxInput" value="1:00.000" aria-label="Max lap time, M:SS.mmm">
                <span id="lapMaxError" class="error-message hidden">Invalid time</span>
            </div>
            <canvas id="lapCanvas" aria-label="Lap times of the followed rider; click or drag to move the replay to that moment"></canvas>

            <div class="rider-head">
                <h2>Riders <small id="riderCount"></small></h2>
                <span class="rider-actions">
                    <button id="showAllBtn" class="secondary-btn" title="Shows the riders who skated with you (more than 0 min together), not the ones who were not on the ice at the same time">Show all skated together</button>
                    <button id="hideAllBtn" class="secondary-btn">Hide all</button>
                </span>
            </div>
            <div id="riderList" class="rider-list"></div>
        </div>
    </div>

    <footer class="theme-switch">
        <span>Light</span>
        <label class="switch">
            <input type="checkbox" id="themeToggle" aria-label="Dark mode">
            <span class="switch-track"></span>
        </label>
        <span>Dark</span>
    </footer>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="replay-track.js"></script>
    <script src="replay-model.js"></script>
    <script src="fetch_overlapping_sessions.js"></script>
    <script src="replay.js"></script>
</body>
</html>
